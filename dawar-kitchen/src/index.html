<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Base title (overwritten by SeoService immediately on load) -->
  <title>Dawar Kitchen</title>
  <base href="/">

  <!-- CSP is delivered as an HTTP header in vercel.json (frame-ancestors
       and nonce-based rules require HTTP headers, not meta tags). -->

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dawar Kitchen">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="msapplication-TileColor" content="#0a0a0a">

  <!-- Open Graph & Twitter Cards are handled dynamically by SeoService -->

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="assets/Dawar-logo.png">
  <link rel="shortcut icon" type="image/png" href="assets/Dawar-logo.png">
  <link rel="apple-touch-icon" href="assets/Dawar-logo.png">

  <!-- ── DNS / Preconnect ─────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://code.iconify.design">
  <link rel="dns-prefetch" href="https://code.iconify.design">

  <!-- ── Critical asset preloads ──────────────────────── -->
  <link rel="preload" href="assets/hero/hero.webp" as="image" type="image/webp" fetchpriority="high">

  <!-- ── Fonts ─────────────────────────────────────────── -->
  <!-- Direct stylesheet link: the onload trick used an inline event handler
       which is blocked by script-src CSP. A regular link tag is CSP-safe. -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Forum&family=Open+Sans:wght@300;400;500;600&display=swap"
        crossorigin>

  <!-- ── Iconify — deferred ───────────────────────────── -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js" defer></script>

  <!-- ── Structured Data ──────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Restaurant",
    "@id": "https://www.dawarkitchen.com/#restaurant",
    "name": "Dawar Kitchen",
    "alternateName": "Dawar Kitchen Social Enterprise",
    "description": "Authentic Egyptian & Syrian cuisine delivered across Cairo. Social enterprise providing dignified employment for Syrian, refugee, and Egyptian women.",
    "url": "https://www.dawarkitchen.com",
    "logo": "https://www.dawarkitchen.com/assets/Dawar-logo.png",
    "image": [
      "https://www.dawarkitchen.com/assets/hero/hero.webp",
      "https://www.dawarkitchen.com/assets/locations/cooking-fire.jpg"
    ],
    "telephone": "+20 10 33737764",
    "email": "info@dawarkitchen.com",
    "servesCuisine": ["Egyptian", "Syrian", "Middle Eastern"],
    "priceRange": "EGP",
    "currenciesAccepted": "EGP",
    "paymentAccepted": "Cash, Credit Card",
    "acceptsReservations": "True",
    "menu": "https://www.dawarkitchen.com/menu",
    "hasMap": "https://maps.google.com/?q=Ezbet+Khairallah+Old+Cairo+Egypt",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "5 Magdy El-Khouly, Ezbet Khairallah",
      "addressLocality": "Old Cairo",
      "addressRegion": "Cairo",
      "postalCode": "",
      "addressCountry": "EG"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 30.0444,
      "longitude": 31.2357
    },
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "09:00",
        "closes": "17:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "10:00",
        "closes": "20:00"
      }
    ],
    "sameAs": [
      "https://www.instagram.com/dawar.kitchen",
      "https://www.facebook.com/dawarkitchen"
    ]
  }
  </script>

  <!-- Critical base styles — zero layout shift before Angular hydrates -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: auto; background: #0a0a0a; }
    html[lang="ar"], html[dir="rtl"] { font-family: 'Cairo', system-ui, sans-serif; }
    body { background: #0a0a0a; font-family: 'Open Sans', system-ui, sans-serif; overflow-x: hidden; }
  </style>
</head>
<body>
  <!-- Theme + scroll-restoration init — external file satisfies script-src 'self' -->
  <script src="assets/init.js"></script>

  <!-- app-splash-screen is rendered by AppComponent (Angular) -->

  <app-root></app-root>
</body>
</html>
