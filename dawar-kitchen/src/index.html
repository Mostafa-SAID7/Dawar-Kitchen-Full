<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dawar Kitchen — Authentic Egyptian & Syrian Cuisine</title>
  <meta name="description" content="Dawar Kitchen: Authentic Egyptian & Syrian cuisine delivered across Cairo. Social enterprise employing Syrian and Egyptian women.">
  <meta name="keywords" content="Dawar Kitchen, Egyptian Syrian cuisine, Cairo delivery, authentic food, social enterprise">
  <meta name="author" content="Dawar Kitchen">
  <base href="/">

  <!-- Canonical -->
  <link rel="canonical" href="https://www.dawarkitchen.com/">

  <!-- CSP is delivered as an HTTP header in vercel.json (frame-ancestors
       and nonce-based rules require HTTP headers, not meta tags). -->

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dawar Kitchen">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="msapplication-TileColor" content="#0a0a0a">

  <!-- Open Graph -->
  <meta property="og:type" content="restaurant">
  <meta property="og:url" content="https://www.dawarkitchen.com/">
  <meta property="og:title" content="Dawar Kitchen — Authentic Egyptian & Syrian Cuisine">
  <meta property="og:description" content="Authentic Egyptian & Syrian cuisine delivered across Cairo. Supporting Syrian and Egyptian women through fair employment.">
  <meta property="og:image" content="https://www.dawarkitchen.com/assets/hero/hero.webp">
  <meta property="og:site_name" content="Dawar Kitchen">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dawar Kitchen — Authentic Egyptian & Syrian Cuisine">
  <meta name="twitter:description" content="Authentic Egyptian & Syrian cuisine delivered across Cairo. Supporting Syrian and Egyptian women.">
  <meta name="twitter:image" content="https://www.dawarkitchen.com/assets/hero/hero.webp">

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="assets/Dawar-logo.png">
  <link rel="shortcut icon" type="image/png" href="assets/Dawar-logo.png">
  <link rel="apple-touch-icon" href="assets/Dawar-logo.png">

  <!-- ── DNS / Preconnect ─────────────────────────────── -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://code.iconify.design">
  <link rel="dns-prefetch" href="https://code.iconify.design">

  <!-- ── Critical asset preloads ──────────────────────── -->
  <link rel="preload" href="assets/hero/hero.webp" as="image" type="image/webp" fetchpriority="high">

  <!-- ── Fonts ─────────────────────────────────────────── -->
  <!-- Direct stylesheet link: the onload trick used an inline event handler
       which is blocked by script-src CSP. A regular link tag is CSP-safe. -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Forum&family=Open+Sans:wght@300;400;500;600&display=swap"
        crossorigin>

  <!-- ── Iconify — deferred ───────────────────────────── -->
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js" defer></script>

  <!-- ── Structured Data ──────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Restaurant",
    "@id": "https://www.dawarkitchen.com/#restaurant",
    "name": "Dawar Kitchen",
    "alternateName": "Dawar Kitchen Social Enterprise",
    "description": "Authentic Egyptian & Syrian cuisine delivered across Cairo. Social enterprise providing dignified employment for Syrian, refugee, and Egyptian women.",
    "url": "https://www.dawarkitchen.com",
    "logo": "https://www.dawarkitchen.com/assets/Dawar-logo.png",
    "image": [
      "https://www.dawarkitchen.com/assets/hero/hero.webp",
      "https://www.dawarkitchen.com/assets/locations/cooking-fire.jpg"
    ],
    "telephone": "+20 10 33737764",
    "email": "info@dawarkitchen.com",
    "servesCuisine": ["Egyptian", "Syrian", "Middle Eastern"],
    "priceRange": "EGP",
    "currenciesAccepted": "EGP",
    "paymentAccepted": "Cash, Credit Card",
    "acceptsReservations": "True",
    "menu": "https://www.dawarkitchen.com/menu",
    "hasMap": "https://maps.google.com/?q=Ezbet+Khairallah+Old+Cairo+Egypt",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "5 Magdy El-Khouly, Ezbet Khairallah",
      "addressLocality": "Old Cairo",
      "addressRegion": "Cairo",
      "postalCode": "",
      "addressCountry": "EG"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": 30.0444,
      "longitude": 31.2357
    },
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "09:00",
        "closes": "17:00"
      },
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "10:00",
        "closes": "20:00"
      }
    ],
    "sameAs": [
      "https://www.instagram.com/dawar.kitchen",
      "https://www.facebook.com/dawarkitchen"
    ]
  }
  </script>

  <!-- ── Splash screen styles (inline — zero network cost) ── -->
  <style nonce="inline-critical-css">
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: auto;
      background: #0a0a0a;
    }

    body {
      background: #0a0a0a;
      font-family: 'Open Sans', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ── Splash overlay ── */
    #nn-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #nn-splash.nn-fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Logo mark */
    .nn-splash-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: nn-rise 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .nn-splash-mark {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(198, 90, 30, 0.35);
      animation: nn-pulse 2.4s ease-in-out infinite;
      background: transparent;
    }
    .nn-splash-mark img {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: contain;
    }
    .nn-splash-name {
      font-size: 22px;
      color: rgba(255,255,255,0.92);
      letter-spacing: 0.04em;
      font-weight: 300;
    }
    .nn-splash-sub {
      font-size: 10px;
      color: #C65A1E;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-top: -8px;
    }

    /* Loading bar */
    .nn-splash-bar {
      width: 120px;
      height: 2px;
      background: rgba(255,255,255,0.06);
      border-radius: 1px;
      overflow: hidden;
      animation: nn-rise 0.55s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    .nn-splash-bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #C65A1E, transparent);
      border-radius: 1px;
      animation: nn-slide 1.4s ease-in-out infinite;
    }

    @keyframes nn-rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes nn-pulse {
      0%, 100% { box-shadow: 0 0 30px rgba(198,90,30,0.25); }
      50%       { box-shadow: 0 0 50px rgba(198,90,30,0.55); }
    }
    @keyframes nn-slide {
      0%   { transform: translateX(-250%); }
      100% { transform: translateX(600%); }
    }
  </style>
</head>
<body>
  <!-- Theme + scroll-restoration init — external file satisfies script-src 'self' -->
  <script src="assets/init.js"></script>

  <!-- Splash screen — removed by AppComponent after first navigation -->
  <div id="nn-splash" aria-hidden="true">
    <div class="nn-splash-logo">
      <div class="nn-splash-mark">
        <img src="assets/Dawar-logo.png" alt="Dawar Kitchen">
      </div>
      <div>
        <div class="nn-splash-name">Dawar Kitchen</div>
        <div class="nn-splash-sub">Authentic Egyptian & Syrian Cuisine</div>
      </div>
    </div>
    <div class="nn-splash-bar"></div>
  </div>

  <app-root></app-root>
</body>
</html>
